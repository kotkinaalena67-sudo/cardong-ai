<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardong AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10121a;color:#f5f5f7;font-family:Arial,sans-serif;height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:800px;display:flex;flex-direction:column;height:100%}
header{padding:18px;border-bottom:1px solid #292c38;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#795cff,#21c8b7);display:grid;place-items:center;font-size:23px;font-weight:bold}
h1{font-size:21px;margin:0}
.subtitle{font-size:12px;color:#9296a8;margin-top:4px}
#chat{flex:1;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;gap:14px}
.welcome{text-align:center;margin:auto 0;color:#b7bbca;line-height:1.6}
.welcome h2{color:white;font-size:27px}
.msg{padding:13px 15px;border-radius:17px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{align-self:flex-end;background:#6753df}
.bot{align-self:flex-start;background:#202330;border:1px solid #303342}
form{padding:12px;display:flex;gap:9px;border-top:1px solid #292c38}
textarea{flex:1;resize:none;max-height:130px;border:1px solid #35394a;background:#1b1e29;color:white;border-radius:15px;padding:14px;font:16px Arial;outline:none}
button{border:0;border-radius:13px;background:#765bff;color:white;font-size:20px;padding:0 19px}
button:disabled{opacity:.5}
footer{text-align:center;color:#777d91;font-size:11px;padding:0 10px 10px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">C</div>
<div><h1>Cardong</h1><div class="subtitle">AI · Твой умный помощник</div></div>
</header>
<main id="chat">
<div class="welcome" id="welcome">
<h2>Привет! Я Cardong 👋</h2>
Задавай вопросы, проси объяснить сложное<br>или просто общайся со мной.
</div>
</main>
<form id="form">
<textarea id="input" rows="1" placeholder="Напиши сообщение..." required></textarea>
<button id="send" type="submit">➤</button>
</form>
<footer>Cardong AI может иногда ошибаться. Проверяй важную информацию.</footer>
</div>
<script>
const chat=document.getElementById("chat");
const form=document.getElementById("form");
const input=document.getElementById("input");
const send=document.getElementById("send");
function addMessage(text,who){
 const welcome=document.getElementById("welcome");
 if(welcome)welcome.remove();
 const div=document.createElement("div");
 div.className="msg "+who;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const message=input.value.trim();
 if(!message||send.disabled)return;
 addMessage(message,"user");
 input.value="";
 send.disabled=true;
 const waiting=addMessage("Думаю...","bot");
 try{
  const r=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });
  const data=await r.json();
  waiting.textContent=r.ok?(data.reply||"Пустой ответ от ИИ"):(data.error||"Ошибка сервера");
 }catch(err){
  waiting.textContent="Не удалось связаться с сервером. Попробуй позже.";
 }
 send.disabled=false;
 input.focus();
 chat.scrollTop=chat.scrollHeight;
});
input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,130)+"px";
});
</script>
</body>
</html>
